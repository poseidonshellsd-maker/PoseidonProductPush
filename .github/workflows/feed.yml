name: Ecwid to Google Feed

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Ecwid feed script
        env:
          ECWID_STORE_ID: ${{ secrets.ECWID_STORE_ID }}
          ECWID_SECRET_TOKEN: ${{ secrets.ECWID_SECRET_TOKEN }}
        run: python ecwid_to_google_feed.py

      - name: Commit updated feed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add google_feed.csv
          git commit -m "Auto-update feed" || echo "No changes to commit"
          git push
